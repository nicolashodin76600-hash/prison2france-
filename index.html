<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Démo Réseau de Neurones en HTML/JS</title>
  <!-- Chargement de Synaptic.js (bibliothèque JS pour réseau de neurones) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/synaptic/1.0.8/synaptic.min.js"></script>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #0f172a;
      color: #f8fafc;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }
    .card {
      background: #1e293b;
      padding: 2rem;
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.3);
      max-width: 400px;
      width: 100%;
    }
    h1 {
      font-size: 1.25rem;
      margin-top: 0;
      color: #38bdf8;
    }
    button {
      width: 100%;
      background: #0284c7;
      color: white;
      border: none;
      padding: 10px 15px;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.2s;
    }
    button:hover {
      background: #0369a1;
    }
    .results {
      margin-top: 1.5rem;
      background: #0f172a;
      padding: 1rem;
      border-radius: 6px;
      font-family: monospace;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>

<div class="card">
  <h1>IA : Apprentissage du XOR</h1>
  <p>Entraîne un réseau de neurones en JavaScript pour résoudre un problème logique.</p>
  
  <button onclick="trainAI()">Lancer l'entraînement de l'IA</button>

  <div class="results" id="output">
    Clique sur le bouton pour démarrer...
  </div>
</div>

<script>
  // 1. Création de l'architecture du réseau de neurones
  // 2 entrées, 3 neurones dans la couche cachée, 1 sortie
  const { Layer, Network, Trainer } = synaptic;
  
  const inputLayer = new Layer(2);
  const hiddenLayer = new Layer(3);
  const outputLayer = new Layer(1);

  inputLayer.project(hiddenLayer);
  hiddenLayer.project(outputLayer);

  const myNetwork = new Network({
    input: inputLayer,
    hidden: [hiddenLayer],
    output: outputLayer
  });

  const trainer = new Trainer(myNetwork);

  function trainAI() {
    const outputDiv = document.getElementById('output');
    outputDiv.innerHTML = "Entraînement en cours...";

    // 2. Jeux de données d'entraînement (logique XOR)
    const trainingSet = [
      { input: [0, 0], output: [0] },
      { input: [0, 1], output: [1] },
      { input: [1, 0], output: [1] },
      { input: [1, 1], output: [0] }
    ];

    // 3. Entraînement du modèle (20 000 itérations)
    setTimeout(() => {
      trainer.train(trainingSet, {
        rate: 0.1,
        iterations: 20000,
        error: 0.005,
        shuffle: true
      });

      // 4. Test des prédictions
      let res = "<b>Résultats après entraînement :</b><br><br>";
      
      trainingSet.forEach(item => {
        const prediction = myNetwork.activate(item.input);
        res += `Entrée: [${item.input.join(', ')}] → Prédiction: <b>${prediction[0].toFixed(3)}</b> (Attendu: ${item.output[0]})<br>`;
      });

      outputDiv.innerHTML = res;
    }, 100);
  }
</script>

</body>
</html>
