<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Telegram App Builder</title>
  <style>
    :root {
      --bg: #0f172a;
      --panel: #1e293b;
      --accent: #2563eb;
      --text: #f8fafc;
      --muted: #94a3b8;
      --border: #334155;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      height: 100vh;
      overflow: hidden;
    }

    /* Panneau Chat */
    .chat-panel {
      width: 450px;
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      background: var(--panel);
    }

    .chat-header {
      padding: 16px;
      background: var(--bg);
      border-bottom: 1px solid var(--border);
      font-weight: bold;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .messages {
      flex: 1;
      padding: 16px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .msg {
      max-width: 88%;
      padding: 12px 16px;
      border-radius: 12px;
      font-size: 14px;
      line-height: 1.5;
      white-space: pre-wrap;
    }

    .msg.bot { background: #334155; align-self: flex-start; }
    .msg.user { background: var(--accent); align-self: flex-end; }

    .chat-input {
      padding: 16px;
      background: var(--bg);
      border-top: 1px solid var(--border);
      display: flex;
      gap: 8px;
    }

    input[type="text"] {
      flex: 1;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--panel);
      color: #fff;
      outline: none;
    }

    button {
      padding: 12px 18px;
      background: var(--accent);
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
    }

    button:hover { opacity: 0.9; }

    /* Panneau Code & Aperçu */
    .workspace {
      flex: 1;
      display: flex;
      flex-direction: column;
      background: #000;
    }

    .tabs {
      display: flex;
      background: var(--bg);
      border-bottom: 1px solid var(--border);
    }

    .tab {
      padding: 12px 24px;
      background: none;
      border: none;
      color: var(--muted);
      border-radius: 0;
      cursor: pointer;
    }

    .tab.active {
      color: #fff;
      border-bottom: 2px solid var(--accent);
      background: var(--panel);
    }

    .content-area {
      flex: 1;
      position: relative;
    }

    textarea {
      width: 100%;
      height: 100%;
      background: #090d16;
      color: #7dd3fc;
      border: none;
      padding: 16px;
      font-family: monospace;
      font-size: 13px;
      resize: none;
      outline: none;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
      background: #fff;
    }

    .hidden { display: none; }
  </style>
</head>
<body>

<div class="chat-panel">
  <div class="chat-header">🤖 Telegram MiniApp Architect</div>
  <div class="messages" id="messages">
    <div class="msg bot">Bonjour ! Je vais t'aider à construire le code complet de ta Telegram Mini App.

Quel type de projet souhaites-tu concevoir ?
1. Un formulaire / système de réservation
2. Un mini-catalogue de produits
3. Un tableau de bord interactif</div>
  </div>
  <div class="chat-input">
    <input type="text" id="userInput" placeholder="Réponds ou décris ton idée..." onkeydown="if(event.key==='Enter') sendMessage()">
    <button onclick="sendMessage()">Envoyer</button>
  </div>
</div>

<div class="workspace">
  <div class="tabs">
    <button class="tab active" onclick="switchTab('code')">Code Source HTML/JS</button>
    <button class="tab" onclick="switchTab('preview')">Aperçu WebApp</button>
  </div>
  <div class="content-area">
    <textarea id="codeView" readonly></textarea>
    <iframe id="previewView" class="hidden"></iframe>
  </div>
</div>

<script>
  let currentStep = 0;
  let generatedCode = {
    title: "Telegram App",
    inputs: [],
    buttons: []
  };

  function switchTab(type) {
    const tabs = document.querySelectorAll('.tab');
    const codeView = document.getElementById('codeView');
    const previewView = document.getElementById('previewView');

    tabs.forEach(t => t.classList.remove('active'));

    if (type === 'code') {
      tabs[0].classList.add('active');
      codeView.classList.remove('hidden');
      previewView.classList.add('hidden');
    } else {
      tabs[1].classList.add('active');
      codeView.classList.add('hidden');
      previewView.classList.remove('hidden');
      updatePreview();
    }
  }

  function addMessage(text, sender) {
    const box = document.getElementById('messages');
    const msg = document.createElement('div');
    msg.className = `msg ${sender}`;
    msg.textContent = text;
    box.appendChild(msg);
    box.scrollTop = box.scrollHeight;
  }

  function sendMessage() {
    const input = document.getElementById('userInput');
    const text = input.value.trim();
    if (!text) return;

    addMessage(text, 'user');
    input.value = '';

    setTimeout(() => {
      processInput(text);
    }, 400);
  }

  function processInput(text) {
    currentStep++;

    if (currentStep === 1) {
      generatedCode.title = text;
      addMessage("Très bien. Quels champs de saisie ou fonctionnalités souhaites-tu ajouter ? (ex: Nom, Date, Sélection d'options)", "bot");
    } 
    else if (currentStep === 2) {
      generatedCode.inputs = text.split(',').map(s => s.trim());
      addMessage("Parfait. Quel doit être le libellé du bouton principal de confirmation Telegram ?", "bot");
    } 
    else {
      generatedCode.buttonText = text;
      addMessage("Code généré avec succès ! Tu peux consulter l'onglet 'Code Source' ou basculer sur 'Aperçu WebApp'.", "bot");
    }

    renderFullApp();
  }

  function renderFullApp() {
    const inputsHtml = generatedCode.inputs.map(i => `
      <div class="field">
        <label>${i}</label>
        <input type="text" placeholder="Saisir ${i.toLowerCase()}...">
      </div>
    `).join('') || '<p>Aucun champ configuré.</p>';

    const fullHTML = `<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>${generatedCode.title}</title>
  <script src="https://telegram.org/js/telegram-web-app.js"><\/script>
  <style>
    body {
      font-family: sans-serif;
      background: var(--tg-theme-bg-color, #18222d);
      color: var(--tg-theme-text-color, #ffffff);
      padding: 16px;
      margin: 0;
    }
    h2 { font-size: 18px; margin-bottom: 16px; }
    .field { margin-bottom: 12px; }
    label { display: block; font-size: 12px; opacity: 0.7; margin-bottom: 4px; }
    input {
      width: 100%;
      padding: 10px;
      box-sizing: border-box;
      border-radius: 8px;
      border: 1px solid rgba(255,255,255,0.2);
      background: rgba(0,0,0,0.2);
      color: #fff;
    }
  </style>
</head>
<body>

  <h2>${generatedCode.title}</h2>
  ${inputsHtml}

  <script>
    const tg = window.Telegram.WebApp;
    tg.expand();

    if (tg.MainButton) {
      tg.MainButton.setText("${generatedCode.buttonText || 'CONFIRMER'}");
      tg.MainButton.show();
      tg.MainButton.onClick(() => {
        tg.sendData("Données envoyées depuis la WebApp");
      });
    }
  <\/script>
</body>
</html>`;

    document.getElementById('codeView').value = fullHTML;
  }

  function updatePreview() {
    const iframe = document.getElementById('previewView');
    const code = document.getElementById('codeView').value;
    iframe.srcdoc = code;
  }

  // Initialisation
  renderFullApp();
</script>

</body>
</html>
